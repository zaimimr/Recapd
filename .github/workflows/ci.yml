name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (non-blocking until pre-existing errors are cleared)
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  payment:
    name: payment flow (iOS + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Payment flow suite
        run: >-
          npm test -- --ci --runInBand
          __tests__/payment-flow.test.ts
          __tests__/paywall-errors.test.ts
          __tests__/subscription-flow.test.ts
          __tests__/subscription-advanced.test.ts
          __tests__/subscription-utils.test.ts
          __tests__/subscription-components.test.tsx
