name: release

# Builds Recapd with the native toolchains (no Expo account, no EAS credits) and
# ships it TO TESTERS: Play internal track and TestFlight. Production promotion
# stays manual. See docs/RELEASE_CI.md.
#
# Both jobs stay off until the matching repository variable is "true", so merging
# this workflow cannot ship anything by itself.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: android
        options: [android, ios, both]

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # Build numbers come from the run number plus this offset, so they always land
  # above what the stores already hold (Play vc34, App Store build 49).
  BUILD_NUMBER_OFFSET: 100
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
  EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
  EXPO_PUBLIC_SUBSCRIPTIONS_ENABLED: "true"

jobs:
  android:
    name: android -> Play internal
    if: >-
      (github.event_name == 'push' && vars.ENABLE_ANDROID_RELEASE == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["android","both"]'), inputs.platform))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fail fast on missing secrets
        run: |
          missing=""
          [ -n "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" ] || missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -n "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" ] || missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}" ] || missing="$missing EXPO_PUBLIC_REVENUECAT_ANDROID_KEY"
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Prebuild the Android project
        run: npx expo prebuild --platform android --clean

      - name: Stamp version and build number
        run: node scripts/ci/apply-build-number.mjs android "$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))"

      - name: Point the release build at the upload keystore
        run: node scripts/ci/android-release-signing.mjs

      - name: Write the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "RECAPD_UPLOAD_STORE_FILE=upload.jks"
            echo "RECAPD_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "RECAPD_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RECAPD_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Build the AAB
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Verify the artifact
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$aab" || { echo "::error::no AAB produced"; exit 1; }
          ls -lh "$aab"

      - name: Upload to the Play internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_SERVICE_ACCOUNT_KEY_PATH: ${{ runner.temp }}/play-key.json
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > "$PLAY_SERVICE_ACCOUNT_KEY_PATH"
          node scripts/ci/play-upload.mjs android/app/build/outputs/bundle/release/app-release.aab internal

      - name: Keep the build for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: recapd-android-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Shred the credentials
        if: always()
        run: rm -f android/app/upload.jks "${{ runner.temp }}/play-key.json"

  ios:
    name: ios -> TestFlight
    # macOS minutes bill at 10x on a private repo, so this one is opt-in.
    if: >-
      (github.event_name == 'push' && vars.ENABLE_IOS_RELEASE == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["ios","both"]'), inputs.platform))
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: 9L246T935B
      ASC_KEY_ID: 734B75F2PY
      ASC_ISSUER_ID: a2d1bd8d-dc23-4161-904a-9f088eef8144
      PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fail fast on missing secrets
        run: |
          missing=""
          [ -n "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" ] || missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -n "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" ] || missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}" ] || missing="$missing EXPO_PUBLIC_REVENUECAT_IOS_KEY"
          [ -n "${{ secrets.IOS_DIST_P12_BASE64 }}" ] || missing="$missing IOS_DIST_P12_BASE64"
          [ -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          [ -n "$PROFILE_NAME" ] || missing="$missing IOS_PROVISIONING_PROFILE_NAME(variable)"
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing"
            exit 1
          fi

      - name: Show the Xcode in use
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Import the signing certificate
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/recapd-signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          rm -f "$RUNNER_TEMP/dist.p12"

          # The cert may be named "iPhone Distribution" (legacy) or "Apple Distribution".
          # Pin whichever one we actually imported instead of guessing.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -oE '"(Apple|iPhone) Distribution: [^"]+"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::no distribution identity in the keychain"; exit 1; }
          echo "CODE_SIGN_IDENTITY_NAME=$identity" >> "$GITHUB_ENV"
          echo "signing as: $identity"

      - name: Install the provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$dir/recapd-ci.mobileprovision"
          security cms -D -i "$dir/recapd-ci.mobileprovision" | plutil -p - | grep -E '"Name"|ExpirationDate'

      - name: Prebuild the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Stamp version and build number
        run: node scripts/ci/apply-build-number.mjs ios "$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))"

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Recapd.xcworkspace \
            -scheme Recapd \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Recapd.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -allowProvisioningUpdates NO

      - name: Export the IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zaimimran.recapd</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Recapd.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify the artifact
        run: |
          ipa="$(ls "$RUNNER_TEMP/export"/*.ipa 2>/dev/null | head -1)"
          test -n "$ipa" && test -s "$ipa" || { echo "::error::no IPA produced"; exit 1; }
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"
          ls -lh "$ipa"

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the build for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: recapd-ios-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Shred the credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/recapd-signing.keychain-db" || true
          rm -f "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/recapd-ci.mobileprovision"
