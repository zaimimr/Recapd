name: release

# Builds the app and ships it to TESTERS, never straight to the public stores.
#   push to main            -> Play internal track / TestFlight
#   workflow_dispatch       -> same, on demand, pick the platform
#   promote to production   -> still manual, see docs/RELEASE_CI.md
#
# Both jobs stay off until the matching repository variable is set to "true",
# so merging this workflow cannot ship anything by itself.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: android
        options: [android, ios, both]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  android:
    name: android -> Play internal
    if: >-
      (github.event_name == 'push' && vars.ENABLE_ANDROID_RELEASE == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["android","both"]'), inputs.platform))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@24

      - name: Write Play service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing"
            exit 1
          fi
          mkdir -p credentials/android
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > credentials/android/serviceAccountKey.json

      - name: Build AAB locally (no EAS build credits)
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          eas build --local --non-interactive \
            --platform android \
            --profile production \
            --output "$RUNNER_TEMP/recapd.aab"

      - name: Verify the artifact exists
        run: |
          test -s "$RUNNER_TEMP/recapd.aab" || {
            echo "::error::eas build reported success but produced no AAB (it can exit 0 on failure)"
            exit 1
          }
          ls -lh "$RUNNER_TEMP/recapd.aab"

      - name: Submit to the Play internal track
        run: |
          eas submit --non-interactive \
            --platform android \
            --profile internal \
            --path "$RUNNER_TEMP/recapd.aab"

      - name: Keep the build for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: recapd-android-${{ github.sha }}
          path: ${{ runner.temp }}/recapd.aab
          retention-days: 14
          if-no-files-found: error

      - name: Remove the service account key
        if: always()
        run: rm -f credentials/android/serviceAccountKey.json

  ios:
    name: ios -> TestFlight
    # macOS minutes bill at 10x on a private repo, so this one is opt-in.
    if: >-
      (github.event_name == 'push' && vars.ENABLE_IOS_RELEASE == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["ios","both"]'), inputs.platform))
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show the Xcode in use
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@24

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8 secret is missing"
            exit 1
          fi
          mkdir -p credentials/ios
          printf '%s' "$ASC_KEY_P8" | base64 -d > credentials/ios/asc-api-key.p8

      - name: Build IPA locally (no EAS build credits)
        run: |
          eas build --local --non-interactive \
            --platform ios \
            --profile production \
            --output "$RUNNER_TEMP/recapd.ipa"

      - name: Verify the artifact exists
        run: |
          test -s "$RUNNER_TEMP/recapd.ipa" || {
            echo "::error::eas build reported success but produced no IPA (it can exit 0 on failure)"
            exit 1
          }
          ls -lh "$RUNNER_TEMP/recapd.ipa"

      - name: Upload to TestFlight
        run: |
          eas submit --non-interactive \
            --platform ios \
            --profile internal \
            --path "$RUNNER_TEMP/recapd.ipa"

      - name: Keep the build for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: recapd-ios-${{ github.sha }}
          path: ${{ runner.temp }}/recapd.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Remove the API key
        if: always()
        run: rm -f credentials/ios/asc-api-key.p8
