    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "Recapd",
      "operatingSystem": "iOS, Android",
      "applicationCategory": "PhotographyApplication",
      "description": "A shared event memory app that automatically collects photos and videos from weddings, parties, concerts, and festivals into one feed. No account needed for guests.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "downloadUrl": [
        "https://apps.apple.com/no/app/recapd/id6758083751",
        "https://play.google.com/store/apps/details?id=com.zaimimran.recapd"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do guests need to download the app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, guests download the app to contribute photos and videos. But they don't need to create an account. They just open the invite link, pick their media, and contribute. Takes about 30 seconds."
          }
        },
        {
          "@type": "Question",
          "name": "How does the auto-scan work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When you create an event, you set the start and end time. After the event, Recapd scans each guest's camera roll for photos and videos taken during that window. No manual sorting needed."
          }
        },
        {
          "@type": "Question",
          "name": "What happens to my photos after the event?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Media is stored for 14 days. During that time, anyone in the event can browse and download full-resolution copies. After 14 days, the shared data is automatically cleaned up."
          }
        },
        {
          "@type": "Question",
          "name": "Is Recapd free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, for events up to 10 people. If you're hosting something bigger, Pro is $2.99/month and only the host needs it. Every guest always joins free."
          }
        },
        {
          "@type": "Question",
          "name": "Does it work on both iPhone and Android?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Recapd is available on both the App Store and Google Play. Guests with any phone can contribute to the same event."
          }
        },
        {
          "@type": "Question",
          "name": "How is this different from a shared album or Google Photos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Shared albums require everyone to manually upload. Recapd auto-scans the right time window, so guests just approve the photos it finds. No manual uploads, no forgotten photos, no setup headaches."
          }
        }
      ]
    }
    </script>
