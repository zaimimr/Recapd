    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do guests need to download the app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Guests scan the QR code or open the invite link and add photos straight from the browser, no account needed. They can also use the app if they prefer. Takes about 30 seconds."
          }
        },
        {
          "@type": "Question",
          "name": "How does the auto-scan work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When you create an event, you set the start and end time. After the event, Recapd scans each guest's camera roll for photos and videos taken during that window. No manual sorting needed."
          }
        },
        {
          "@type": "Question",
          "name": "What happens to my photos after the event?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Media is stored for 14 days. During that time, anyone in the event can browse and download full-resolution copies. After 14 days, the shared data is automatically cleaned up."
          }
        },
        {
          "@type": "Question",
          "name": "Is Recapd free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, for events up to 12 people, which is you plus 11 guests. If you're hosting something bigger, Pro is $39.99 for the first year with our launch offer, and only the host needs it. Every guest always joins free."
          }
        },
        {
          "@type": "Question",
          "name": "Does it work on both iPhone and Android?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Recapd is available on both the App Store and Google Play. Guests with any phone can contribute to the same event."
          }
        },
        {
          "@type": "Question",
          "name": "How is this different from a shared album or Google Photos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Shared albums require everyone to manually upload. Recapd auto-scans the right time window, so guests just approve the photos it finds. No manual uploads, no forgotten photos, no setup headaches."
          }
        }
      ]
    }
