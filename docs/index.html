<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recapd</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 1.125rem;
      color: #666;
      margin-bottom: 3rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    a {
      color: #000;
      text-decoration: none;
      padding: 12px 24px;
      border: 1px solid #ddd;
      border-radius: 8px;
      transition: background 0.2s;
    }
    a:hover {
      background: #f5f5f5;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #000;
        color: #fff;
      }
      h1 {
        color: #fff;
      }
      .tagline {
        color: #888;
      }
      a {
        color: #fff;
        border-color: #333;
      }
      a:hover {
        background: #1a1a1a;
      }
    }
  </style>
</head>
<body>
  <h1>Recapd</h1>
  <p class="tagline">See the night from everyone's eyes</p>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>
  </div>
</body>
</html>
