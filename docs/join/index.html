<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Event - Recapd</title>
  <meta name="description" content="Join an event on Recapd and share your photos with everyone.">
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Join Event on Recapd">
  <meta property="og:description" content="You've been invited to share photos! Open Recapd to join this event.">
  <meta property="og:image" content="https://recapd.app/icon.png">
  <meta property="og:url" content="https://recapd.app/join/">
  
  <link rel="icon" type="image/png" href="../icon.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    
    .subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    
    .code-display {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 32px;
    }
    
    .code-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .code {
      font-size: 36px;
      font-weight: 700;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      letter-spacing: 6px;
    }
    
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .status {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 32px;
    }
    
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    
    .btn:hover {
      transform: scale(1.02);
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn-primary {
      background: #fff;
      color: #000;
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    
    .btn-icon {
      width: 24px;
      height: 24px;
    }
    
    .hidden {
      display: none;
    }
    
    .footer {
      margin-top: 48px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
    }
    
    .footer a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../icon.png" alt="Recapd" class="logo">
    
    <h1>Join Event</h1>
    <p class="subtitle">You've been invited to share photos on Recapd!</p>
    
    <div class="code-display" id="codeDisplay">
      <div class="code-label">Event Code</div>
      <div class="code" id="eventCode">------</div>
    </div>
    
    <div id="loadingState">
      <div class="spinner"></div>
      <p class="status">Opening Recapd...</p>
    </div>
    
    <div id="fallbackState" class="hidden">
      <p class="status">Don't have the app yet? Download it now:</p>
      
      <div class="buttons">
        <a href="#" id="openAppBtn" class="btn btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
          Open in App
        </a>
        
        <a href="#" id="appStoreBtn" class="btn btn-secondary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Download on App Store
        </a>
        
        <a href="#" id="playStoreBtn" class="btn btn-secondary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
          </svg>
          Get it on Google Play
        </a>
      </div>
    </div>
    
    <div class="footer">
      <a href="/">Learn more about Recapd</a>
    </div>
  </div>

  <script>
    // Get the event code from the URL path
    const pathParts = window.location.pathname.split('/');
    const codeIndex = pathParts.indexOf('join') + 1;
    const eventCode = pathParts[codeIndex] || '';
    
    // Display the code
    const codeDisplay = document.getElementById('eventCode');
    if (eventCode && eventCode.length === 6) {
      codeDisplay.textContent = eventCode.toUpperCase();
    }
    
    // Deep link URLs
    const deepLink = `recapd://join/${eventCode}`;
    const universalLink = `https://recapd.app/join/${eventCode}`;
    
    // App Store URLs (update these with your actual app store URLs)
    const appStoreUrl = 'https://apps.apple.com/app/recapd/id123456789'; // TODO: Update with real App Store ID
    const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.zaimimran.recapd';
    
    // Detect platform
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
    const isAndroid = /android/i.test(userAgent);
    
    // Set up buttons
    const openAppBtn = document.getElementById('openAppBtn');
    const appStoreBtn = document.getElementById('appStoreBtn');
    const playStoreBtn = document.getElementById('playStoreBtn');
    
    openAppBtn.href = deepLink;
    appStoreBtn.href = appStoreUrl;
    playStoreBtn.href = playStoreUrl;
    
    // Show/hide platform-specific buttons
    if (isIOS) {
      playStoreBtn.style.display = 'none';
    } else if (isAndroid) {
      appStoreBtn.style.display = 'none';
    }
    
    // Try to open the app
    function tryOpenApp() {
      const loadingState = document.getElementById('loadingState');
      const fallbackState = document.getElementById('fallbackState');
      
      // Create a hidden iframe to try the deep link (works on some browsers)
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = deepLink;
      document.body.appendChild(iframe);
      
      // Also try direct location change for iOS
      if (isIOS) {
        window.location.href = deepLink;
      }
      
      // If still on page after delay, show fallback options
      const timeout = setTimeout(() => {
        loadingState.classList.add('hidden');
        fallbackState.classList.remove('hidden');
      }, 2500);
      
      // If page becomes hidden (app opened), clear timeout
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearTimeout(timeout);
        }
      });
      
      // Also detect blur (app opened)
      window.addEventListener('blur', () => {
        clearTimeout(timeout);
      });
    }
    
    // Start trying to open app after short delay for page load
    if (eventCode && eventCode.length === 6) {
      setTimeout(tryOpenApp, 500);
    } else {
      // No valid code, show fallback immediately
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('fallbackState').classList.remove('hidden');
      document.getElementById('codeDisplay').style.display = 'none';
    }
  </script>
</body>
</html>
