                  - button "More information" [ref=e254] [cursor=pointer]: "?"
                - textbox "Description" [disabled] [ref=e256]: "The photo sharing app that lets you live in the moment. Every event ends the same way: \"Send me your photos!\" followed by weeks of waiting, scattered messages, and expired links. Half the photos never get shared, and the memories fade. Recapd fixes this. We believe photo sharing shouldn't require effort while you are trying to enjoy the party. SET IT AND FORGET IT Create a private event with a start and end time. Invite your friends via link or QR code. Then, close the app. Seriously—put it away. USE YOUR OWN CAMERA We don't replace your camera. Use the iPhone camera, VSCO, or whatever app you love. Recapd works with the photos you are already taking. We aren't trying to change how you capture memories, just how you share them. THE MAGIC RECAP When the event ends, everyone gets a notification. Recapd finds the photos taken during the event timeframe and presents them to you. Review: You see the photos first. Deselect anything private. Upload: One tap adds your angle to the group. Relive: Watch the shared timeline fill up with everyone’s perspective. KEY FEATURES • Zero Friction: Join an event in seconds. No accounts required for guests. • Works with Any Camera: No need to take photos inside the app. Use your native camera and stay in the moment. • Total Privacy: We never upload anything automatically. You review every single photo before it joins the timeline. • No Digital Clutter: Photos are automatically deleted from our servers after 2 weeks. Save your favorites to your camera roll, and let the rest fade away. • Cross-Platform: Works seamlessly with friends on any device. • Full Resolution: Download original quality photos anytime before the event expires. WHY RECAPD? The best camera is the one you have with you. The best photo sharing app is the one you forget is there. Stop chasing friends for photos. Start enjoying the moment. Download Recapd and save the memories that matter. Terms: https://recapd.app/terms"
