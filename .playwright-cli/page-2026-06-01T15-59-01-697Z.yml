                - paragraph [ref=e415]:
                  - generic [ref=e416]:
                    - text: Chinese law requires apps with news, religious, book, and magazine content to have relevant permits in order to be available on the App Store in China mainland. If applicable, enter information about your permits below.
                    - link "Learn More" [ref=e417] [cursor=pointer]:
                      - /url: https://developer.apple.com/help/app-store-connect/reference/app-information
                - textbox "Notes" [disabled] [ref=e419]: "Authentication / Account Access: This app is designed to be frictionless. There is no username/password login or account creation required. Users are authenticated anonymously (via Device ID/iCloud) to allow immediate access to creating and joining events. Functionality Overview: Recapd is a photo sharing app that allows users to create a private event with a start and end time. Users take photos with their native device camera during the event. When the event ends, the app queries the local Photo Library for assets created within that specific timeframe to create a shared timeline. Instructions for Testing the \"Recap\" Flow: Since the core functionality triggers when an event ends, please follow these steps to simulate a completed event immediately: Launch: Open the app (no login needed). Take a Photo: Briefly close the app and take 1-2 photos with the native iOS Camera app (to ensure there is recent media for the app to find). Create Event: Return to Recapd and tap \"Create Event.\" Set Time: Set the Start Time to 1 hour ago and the End Time to the current time (or 1 minute from now). Finish: Once the event \"ends,\" tap the notification or open the event view. Permissions: Accept the Photo Library permission when prompted. Upload: You will see the \"Review\" screen showing the photos you took in Step 2. Select them and tap Upload to see them appear on the shared timeline. Note on Permissions: We request Full Photo Library Access because the app relies on scanning metadata (timestamps) to auto-suggest relevant photos to the user. We do not automatically upload any content. The user must explicitly review and confirm which photos are uploaded to the server. Note on Ephemeral Content: Photos are deleted from the server after 2 weeks."
